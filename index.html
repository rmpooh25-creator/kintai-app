<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>勤怠打刻システム</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 400px;
      margin: 30px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 2px 2px 12px rgba(0,0,0,0.1);
    }
    h2 { text-align: center; color: #333; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }
    .password-container {
      position: relative;
      width: 100%;
    }
    .password-container input {
      padding-right: 40px;
    }
    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      user-select: none;
      font-size: 18px;
    }
    .btn-container {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }
    button.btn-submit {
      width: 48%;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-in { background-color: #28a745; }
    .btn-out { background-color: #dc3545; }
    #resultMessage {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
      font-size: 16px;
    }
    #customNameGroup, #confirmPasswordGroup, #customTimeGroup {
      display: none;
    }
    #customTimeGroup {
      background-color: #fff3cd;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ffeeba;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h2>勤怠打刻システム</h2>

  <!-- 名前選択 -->
  <label for="nameSelect">名前</label>
  <select id="nameSelect" onchange="toggleCustomFields()">
    <option value="">読み込み中...</option>
  </select>

  <!-- 新規名前入力（非表示領域） -->
  <div id="customNameGroup">
    <input type="text" id="customNameInput" placeholder="新しい名前を入力してください">
  </div>

  <!-- パスワード入力（👁マーク付き） -->
  <label for="password">パスワード</label>
  <div class="password-container">
    <input type="password" id="password" placeholder="パスワードを入力">
    <span class="toggle-password" onclick="togglePasswordVisibility('password', this)">👁️</span>
  </div>

  <!-- 新規用パスワード確認（非表示領域） -->
  <div id="confirmPasswordGroup">
    <label for="confirmPassword">パスワード（確認用）</label>
    <div class="password-container">
      <input type="password" id="confirmPassword" placeholder="もう一度パスワードを入力">
      <span class="toggle-password" onclick="togglePasswordVisibility('confirmPassword', this)">👁️</span>
    </div>
  </div>

  <!-- 時間修正入力（未出勤の退勤エラー時に表示） -->
  <div id="customTimeGroup">
    <label for="customTimeInput" style="margin-top:0; color:#856404;">✏️ 修正出勤時間（例: 09:00）</label>
    <input type="time" id="customTimeInput">
    <small style="color:#856404; display:block; margin-top:3px;">※空欄の場合は現在時刻で出勤打刻されます</small>
  </div>

  <!-- 備考 -->
  <label for="note">備考（任意）</label>
  <input type="text" id="note" placeholder="連絡事項など">

  <!-- 打刻ボタン -->
  <div class="btn-container">
    <button class="btn-submit btn-in" onclick="sendAttendance('出勤')">出勤</button>
    <button class="btn-submit btn-out" onclick="sendAttendance('退勤')">退勤</button>
  </div>

  <div id="resultMessage"></div>

  <script>
    // WebアプリURL（最新版に設定済み）
    const GAS_URL = "https://script.google.com/macros/s/AKfycbykL2Tdlp1VTQezKbz7tayM5vf3dJnqQH-ZD1fI0NH7iRV2FlBAgLnHsi-g5YaI9nYKAQ/exec";

    // 画面読み込み時に名前リストを取得
    window.onload = function() {
      fetch(GAS_URL)
        .then(res => res.json())
        .then(data => {
          const select = document.getElementById("nameSelect");
          select.innerHTML = '<option value="">選択してください</option>';
          
          if (data.names && data.names.length > 0) {
            data.names.forEach(name => {
              const option = document.createElement("option");
              option.value = name;
              option.textContent = name;
              select.appendChild(option);
            });
          }
          
          const newOption = document.createElement("option");
          newOption.value = "__NEW__";
          newOption.textContent = "＋ 新しい名前を直接入力する";
          select.appendChild(newOption);
        })
        .catch(err => {
          console.error(err);
          document.getElementById("nameSelect").innerHTML = '<option value="">読み込み失敗</option>';
        });
    };

    // 新規登録時の入力欄表示切替
    function toggleCustomFields() {
      const select = document.getElementById("nameSelect");
      const customNameGroup = document.getElementById("customNameGroup");
      const confirmPasswordGroup = document.getElementById("confirmPasswordGroup");
      
      if (select.value === "__NEW__") {
        customNameGroup.style.display = "block";
        confirmPasswordGroup.style.display = "block";
      } else {
        customNameGroup.style.display = "none";
        confirmPasswordGroup.style.display = "none";
      }
    }

    // パスワードの伏字切り替え（👁）
    function togglePasswordVisibility(inputId, toggleIcon) {
      const input = document.getElementById(inputId);
      if (input.type === "password") {
        input.type = "text";
        toggleIcon.textContent = "🙈";
      } else {
        input.type = "password";
        toggleIcon.textContent = "👁️";
      }
    }

    // 打刻送信処理
    function sendAttendance(type) {
      const select = document.getElementById("nameSelect");
      let name = select.value;
      const isNewUser = (name === "__NEW__");
      
      if (isNewUser) {
        name = document.getElementById("customNameInput").value.trim();
      }
      
      const password = document.getElementById("password").value.trim();
      const confirmPassword = document.getElementById("confirmPassword") ? document.getElementById("confirmPassword").value.trim() : "";
      const customTime = document.getElementById("customTimeInput").value;
      const note = document.getElementById("note").value.trim();
      const resultMessage = document.getElementById("resultMessage");

      // バリデーションチェック
      if (!name) {
        alert("名前を選択または入力してください。");
        return;
      }
      if (!password) {
        alert("パスワードを入力してください。");
        return;
      }

      if (isNewUser) {
        if (!confirmPassword) {
          alert("確認用パスワードを入力してください。");
          return;
        }
        if (password !== confirmPassword) {
          resultMessage.style.color = "red";
          resultMessage.textContent = "エラー: パスワードが一致しません。";
          return;
        }
      }

      resultMessage.style.color = "black";
      resultMessage.textContent = "送信中...";

      const payload = {
        name: name,
        password: password,
        type: type,
        customTime: customTime,
        note: note
      };

      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === "success") {
          resultMessage.style.color = "green";
          resultMessage.textContent = `【${type}】を送信しました！`;
          document.getElementById("customTimeGroup").style.display = "none";
          document.getElementById("customTimeInput").value = "";
        } else {
          resultMessage.style.color = "red";
          resultMessage.textContent = `エラー: ${data.message}`;

          if (data.message.includes("出勤打刻されていません")) {
            document.getElementById("customTimeGroup").style.display = "block";
          }
        }
      })
      .catch(error => {
        console.error(error);
        resultMessage.style.color = "red";
        resultMessage.textContent = "送信に失敗しました。";
      });
    }
  </script>
</body>
</html>
